name: CD

# Runs automatically only after CI succeeded on main (or manually).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  # Commit that CI validated (falls back to current sha for manual runs)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  ECR_REPOSITORY: dementia-prediction
  MODEL_PREFIX: dementia-model
  CONTAINER_NAME: dementia-app

jobs:
  # ---------------------------------------------------------------- 1. model -> registry
  upload-model:
    name: Upload model to registry
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Prefer the standard name; accept the existing AWS_SECRET_ACCESS secret as a fallback.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure versioned registry bucket exists
        env:
          BUCKET: ${{ secrets.MODEL_REGISTRY_BUCKET }}
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Upload ./model to registry
        run: >
          python scripts/model_registry.py upload
          --bucket "${{ secrets.MODEL_REGISTRY_BUCKET }}"
          --prefix "$MODEL_PREFIX"
          --version "$SHA"
          --src model

  # ---------------------------------------------------------------- 2. docker image (pulls model from registry)
  build-and-push:
    name: Build image from registry model + push to ECR
    needs: upload-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile downloads the model from the registry at build time.
      # AWS credentials are passed as BuildKit secrets (never stored in layers).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            MODEL_STAGE=model-registry
            MODEL_REGISTRY_BUCKET=${{ secrets.MODEL_REGISTRY_BUCKET }}
            MODEL_VERSION=${{ env.SHA }}
            AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          secrets: |
            aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_SECRET_ACCESS }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 3. run the container on EC2
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # (registry URL is recomputed here on purpose: job outputs that contain
      #  a secret value, such as the region, are dropped by GitHub)
      - name: Get ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing repository/environment secret EC2_HOST}"
          : "${EC2_SSH_KEY:?Missing repository/environment secret EC2_SSH_KEY}"

          SSH_DIR="$RUNNER_TEMP/cd-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$SSH_DIR/ec2_key"
          chmod 600 "$SSH_DIR/ec2_key"
          ssh-keygen -y -f "$SSH_DIR/ec2_key" >/dev/null

          if ! ssh-keyscan -T 15 -H "$EC2_HOST" > "$SSH_DIR/known_hosts" 2>/dev/null; then
            echo "Could not resolve or reach EC2_HOST '$EC2_HOST' on SSH port 22."
            exit 1
          fi
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Deploy container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing repository/environment secret EC2_HOST}"
          : "${EC2_USER:?Missing repository/environment secret EC2_USER}"

          SSH_DIR="$RUNNER_TEMP/cd-ssh"
          SSH="ssh -i $SSH_DIR/ec2_key -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHA"
          REMOTE="$EC2_USER@$EC2_HOST"

          # Short-lived ECR token generated here; nothing persisted on the server
          aws ecr get-login-password --region "$AWS_REGION" \
            | $SSH "$REMOTE" "docker login --username AWS --password-stdin $REGISTRY"

          $SSH "$REMOTE" bash -s -- "$IMAGE" "$CONTAINER_NAME" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; NAME="$2"

          docker pull "$IMAGE"

          PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$NAME" 2>/dev/null || true)
          docker rm -f "$NAME" >/dev/null 2>&1 || true

          docker run -d --name "$NAME" --restart unless-stopped -p 80:5000 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fs http://localhost:80/ >/dev/null; then
              echo "Deployment healthy: $IMAGE"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed, logs:"; docker logs "$NAME" || true
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          if [ -n "$PREV_IMAGE" ]; then
            echo "Rolling back to $PREV_IMAGE"
            docker run -d --name "$NAME" --restart unless-stopped -p 80:5000 "$PREV_IMAGE"
          fi
          exit 1
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/cd-ssh"

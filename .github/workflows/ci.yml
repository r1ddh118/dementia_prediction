name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install flake8

      # Hard failures: syntax errors, undefined names, unused imports/variables
      - name: flake8 (blocking)
        run: flake8 src scripts tests --select=E9,F63,F7,F82,F401,F841 --show-source

      # Style issues are reported but do not fail the build
      - name: flake8 (style, informational)
        run: flake8 src scripts tests --exit-zero --statistics

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No AWS credentials needed: S3 is mocked with moto
      - name: Run tests
        run: >
          pytest -v
          --cov=src --cov=scripts
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=pytest-report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # CI uses the model committed in ./model (no AWS access needed).
      # CD builds the same Dockerfile but pulls the model from the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: dementia-app:ci
          build-args: MODEL_STAGE=model-local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name app -p 5000:5000 dementia-app:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/ > /dev/null && break
            sleep 2
          done
          curl -fs http://localhost:5000/ | grep -q "Dementia Prediction"
          curl -fs -X POST http://localhost:5000/predict \
            -d age=70 -d sex=0 -d education=12 -d ses=3 \
            -d mmse=25 -d etiv=1500 -d nwbv=0.75 -d asf=1.10 \
            | tee /dev/stderr | grep -q '"prediction"'

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

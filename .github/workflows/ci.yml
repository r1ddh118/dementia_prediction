name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install flake8

      # Hard failures: syntax errors, undefined names, unused imports/variables
      - name: flake8 (blocking)
        run: flake8 src scripts tests --select=E9,F63,F7,F82,F401,F841 --show-source

      # Style issues are reported but do not fail the build
      - name: flake8 (style, informational)
        run: flake8 src scripts tests --exit-zero --statistics

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Model artifacts (.joblib) are committed to the repo.
      # S3 is mocked with moto during tests — no real AWS calls made by pytest.
      - name: Run tests
        run: >
          pytest -v
          --cov=src --cov=scripts
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=pytest-report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

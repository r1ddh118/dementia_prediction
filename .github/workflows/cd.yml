name: CD

# Runs automatically only after CI succeeded on main (or manually).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  # Commit that CI validated (falls back to current sha for manual runs)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  ECR_REPOSITORY: dementia-prediction
  MODEL_PREFIX: dementia-model
  CONTAINER_NAME: dementia-app

jobs:
  # ---------------------------------------------------------------- 1. datasets -> S3 + model -> registry
  upload-model:
    name: Upload datasets + model to S3
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install boto3 "dvc[s3]"

      - name: Validate AWS credentials configuration
        env:
          AWS_SECRET_ACCESS: ${{ secrets.AWS_SECRET_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          test -n "$AWS_SECRET_ACCESS" || { echo "Missing repository secret AWS_SECRET_ACCESS."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing repository secret AWS_SECRET_ACCESS_KEY."; exit 1; }
          test -n "$AWS_REGION" || { echo "Missing repository secret AWS_REGION."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---- Datasets: pull from DVC remote (s3://dementia-dataset-bucket/dvc) ----
      - name: Pull datasets via DVC
        run: dvc pull

      # ---- Model -> MODEL_REGISTRY_BUCKET ----
      - name: Ensure versioned registry bucket exists
        env:
          BUCKET: ${{ secrets.MODEL_REGISTRY_BUCKET }}
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Upload ./model to registry
        run: >
          python scripts/model_registry.py upload
          --bucket "${{ secrets.MODEL_REGISTRY_BUCKET }}"
          --prefix "$MODEL_PREFIX"
          --version "$SHA"
          --src model

  # ---------------------------------------------------------------- 2. docker image (pulls model from registry)
  build-and-push:
    name: Build image from registry model + push to ECR
    needs: upload-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile fetches the model from MODEL_REGISTRY_BUCKET at build time.
      # AWS credentials are passed as BuildKit secrets (never baked into layers).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            MODEL_STAGE=model-registry
            MODEL_REGISTRY_BUCKET=${{ secrets.MODEL_REGISTRY_BUCKET }}
            MODEL_VERSION=${{ env.SHA }}
            AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}
          secrets: |
            aws_access_key_id=${{ secrets.AWS_SECRET_ACCESS }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 3. provision EC2 + deploy
  deploy:
    name: Provision EC2 + deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create or update EC2 app stack
        run: |
          set -euo pipefail
          REGISTRY_URI="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text)"
          IMAGE_URI="$REGISTRY_URI:$SHA"
          echo "Deploying ECR image: $IMAGE_URI"

          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name dementia-prediction \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"

          # A previous update left the subnet in a conflict state — skip it so
          # CF can finish rolling back, then we deploy fresh on top.
          if [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Stack is UPDATE_ROLLBACK_FAILED — continuing rollback, skipping AppPublicSubnet."
            aws cloudformation continue-update-rollback \
              --stack-name dementia-prediction \
              --resources-to-skip AppPublicSubnet
            aws cloudformation wait stack-rollback-complete \
              --stack-name dementia-prediction
            echo "Rollback complete. Proceeding with deploy."
            STACK_STATUS="UPDATE_ROLLBACK_COMPLETE"
          fi

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Removing failed initial stack before recreating it."
            aws cloudformation delete-stack --stack-name dementia-prediction
            aws cloudformation wait stack-delete-complete --stack-name dementia-prediction
          fi

          if ! aws cloudformation deploy \
            --template-file infra/ec2-app.yml \
            --stack-name dementia-prediction \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ImageUri=$IMAGE_URI" "ContainerName=$CONTAINER_NAME"; then
            echo "CloudFormation deployment failed. Recent stack events:"
            aws cloudformation describe-stack-events \
              --stack-name dementia-prediction \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`UPDATE_ROLLBACK_FAILED` || ResourceStatus==`ROLLBACK_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            exit 1
          fi

          APP_URL="$(aws cloudformation describe-stacks \
            --stack-name dementia-prediction \
            --query 'Stacks[0].Outputs[?OutputKey==`AppUrl`].OutputValue | [0]' \
            --output text)"
          INSTANCE_ID="$(aws cloudformation describe-stacks \
            --stack-name dementia-prediction \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue | [0]' \
            --output text)"

          echo "Waiting for $APP_URL to become healthy (instance $INSTANCE_ID)."
          for i in $(seq 1 120); do
            if curl -fsS "$APP_URL/health" | grep -q '"status":"ok"' \
              && curl -fsS -X POST "$APP_URL/predict" \
                -d age=70 -d sex=0 -d education=12 -d ses=3 \
                -d mmse=25 -d etiv=1500 -d nwbv=0.75 -d asf=1.10 \
                | grep -q '"prediction"'; then
              echo "Deployment healthy: $APP_URL"
              {
                echo "### App deployed"
                echo "URL: [$APP_URL]($APP_URL)"
                echo "EC2 instance: \`$INSTANCE_ID\`"
                echo "Model version: \`$SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed at $APP_URL"
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].[State.Name,PublicIpAddress,InstanceType]' \
            --output table || true
          aws ec2 get-console-output \
            --instance-id "$INSTANCE_ID" \
            --latest --query Output --output text || true
          exit 1
